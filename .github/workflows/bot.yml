name: Demo Memecoin Botu

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      rapor_test:
        description: "Test raporu da gönder (true / false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: memecoin-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli paketi kur
        run: pip install requests

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_NOW: ${{ github.event.inputs.rapor_test }}
        run: python bot.py

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "demo-bot"
          git config user.email "demo-bot@users.noreply.github.com"
          git add state.json trades.csv positions.csv
          git diff --cached --quiet || (git commit -m "bot durumu" && git push)
